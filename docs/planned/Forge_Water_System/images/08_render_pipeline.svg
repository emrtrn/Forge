<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 735"><defs><style>.h{font:bold 34px Arial;fill:#193845}.b{font:bold 23px Arial;fill:#193845}.t{font:18px Arial;fill:#486a78}.r{fill:#f0f6f7;stroke:#b7d3d8;stroke-width:2}</style><marker id="a" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2f8597"/></marker></defs><rect width="1400" height="735" fill="#f9fcfd"/><text x="50" y="65" class="h">Önerilen görselleştirme sırası / maliyet kontrolü</text>
<rect class="r" x="60" y="125" width="385" height="112" rx="18"/><text class="b" x="89" y="170">Opaque sahne</text><text class="t" x="89" y="201">Arazi, kaya, foliage</text>
<path d="M449 181 H518" stroke="#2f8597" stroke-width="5" marker-end="url(#a)"/>
<rect class="r" x="530" y="125" width="380" height="112" rx="18"/><text class="b" x="556" y="168">Renk + derinlik</text><text class="t" x="556" y="201">Su için örnekleme kaynakları</text>
<path d="M910 181 H978" stroke="#2f8597" stroke-width="5" marker-end="url(#a)"/>
<rect x="991" y="125" width="340" height="112" rx="18" fill="#d5e8ed" stroke="#9abcc8" stroke-width="2"/><text class="b" x="1014" y="168">Su görünümü</text><text class="t" x="1014" y="201">Shader + profiller</text>
