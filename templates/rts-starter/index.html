<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Forge rts-starter</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--
      Byte-for-byte the game-starter's page apart from the script it loads: a
      characterless strategy game needs no different markup than any other Forge
      game, because the page is not where a game differs — its capability list
      and its game module are.

      In a fork this file replaces the repo-root `index.html` (and the script
      below becomes `/src/main.ts`). Kept here so the starter can be opened in
      the dev server as-is: /templates/rts-starter/index.html
    -->
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay">
      <div id="debug-stats" aria-hidden="true"></div>
    </div>
    <script type="module" src="/templates/rts-starter/main.ts"></script>
  </body>
</html>
