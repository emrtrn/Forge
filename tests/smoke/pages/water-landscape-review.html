<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LandscapeTest · Su karşılaştırması</title>
<link rel="stylesheet" href="/src/style.css">
<style>
  #review-bar { position:fixed;z-index:10000;inset:0 0 auto;height:52px;background:#17212b;color:#e8edf2;display:flex;align-items:center;gap:16px;padding:0 14px;font:14px system-ui; }
  #review-bar label { display:flex;align-items:center;gap:6px; }
  #game-canvas { position:absolute;top:52px;width:100vw;height:calc(100vh - 52px); }
  #review-status { margin-left:auto;font-size:12px; }
</style></head><body>
<div id="review-bar">
 <strong>LandscapeTest</strong>
 <label>Kamera <select id="review-view">
  <option value="river-upper">Nehir · Üst bölüm</option><option value="river-bank">Nehir · Kıyı</option>
  <option value="river-flat">Nehir · Alt bölüm</option><option value="river-top">Nehir · Üstten</option>
  <option value="lake-overview">Göl · Genel</option><option value="lake-shore">Göl · Kıyı</option><option value="lake-top">Göl · Üstten</option>
 </select></label>
 <label>Sürüm <select id="review-variant"><option value="after">Prototip · Medium</option><option value="before">Önceki nehir · Medium</option><option value="off">Su kapalı</option><option value="low">Prototip · Yansıma kapalı</option><option value="high">Prototip · High</option></select></label>
 <label><input id="review-motion" type="checkbox">Hareket</label>
 <span id="review-status">Sahne yükleniyor…</span>
</div>
<canvas id="game-canvas"></canvas><div id="ui-overlay"><div id="debug-stats"></div></div>
<script type="module" src="./water-landscape-review.ts"></script>
</body></html>
