<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge spike: GPU CDLOD terrain</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10141a;
        color: #e8edf2;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      [hidden] {
        display: none !important;
      }
      #spike-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 8px 10px;
        max-width: calc(100vw - 36px);
        white-space: pre-wrap;
        background: rgba(10, 14, 20, 0.72);
        border-radius: 6px;
        pointer-events: none;
      }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 16px;
        background: #10141a;
      }
      #report-panel {
        position: fixed;
        right: 8px;
        bottom: 8px;
        width: min(760px, calc(100vw - 16px));
        padding: 8px;
        background: rgba(10, 14, 20, 0.92);
        border-radius: 6px;
      }
      #report {
        width: 100%;
        height: 320px;
        box-sizing: border-box;
        color: inherit;
        background: #0b0e13;
        border: 1px solid #2a3442;
        font: inherit;
      }
      #report-panel button {
        margin-top: 6px;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <!-- OPEN_WORLD_PLAN Faz 0 / S1+S2 throwaway spike; never merged to main. -->
    <canvas id="spike-canvas"></canvas>
    <pre id="hud"></pre>
    <div id="status">Starting…</div>
    <div id="report-panel" hidden>
      <textarea id="report" readonly></textarea>
      <button id="copy-report" type="button">Copy</button>
      <button id="close-report" type="button">Close</button>
    </div>
    <script type="module" src="/spikes/terrain-cdlod/main.ts"></script>
  </body>
</html>
