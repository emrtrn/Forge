<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Forge game-starter</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--
      The same three elements the template's own page has: the WebGL canvas and
      the HTML overlay the runtime UI mounts into. A starter game needs no other
      markup — everything else comes from the level.

      In a fork this file replaces the repo-root `index.html` (and the script
      below becomes `/src/main.ts`). Kept here so the starter can be opened in
      the dev server as-is: /templates/game-starter/index.html
    -->
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay">
      <div id="debug-stats" aria-hidden="true"></div>
    </div>
    <script type="module" src="/templates/game-starter/main.ts"></script>
  </body>
</html>
