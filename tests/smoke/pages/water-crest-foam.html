<!doctype html><html><head><meta charset="utf-8"><title>Water crest foam QA</title></head>
<body style="margin:0;background:#182e35;color:white;font:14px sans-serif"><div style="padding:10px;display:flex;gap:15px;align-items:center">
<label>Water <select id="kind"><option>lake</option><option>river</option></select></label>
<label>Enabled <input id="enabled" type="checkbox" checked></label>
<label>Strength <input id="strength" type="number" min="0" max="1" step=".05" value=".75"></label>
<label>Threshold <input id="threshold" type="number" min="0" max="1" step=".05" value=".35"></label>
<label>Waves <input id="waves" type="checkbox" checked></label>
<label>Quality <select id="quality"><option>high</option><option>medium</option><option>low</option></select></label>
<label>Light <select id="light"><option>day</option><option>shadow</option><option>night</option></select></label>
</div><script type="module" src="./water-crest-foam.ts"></script></body></html>
