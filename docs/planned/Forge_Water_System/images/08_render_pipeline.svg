<rect class="r" x="61" y="515" width="1270" height="142" rx="18"/><text class="b" x="86" y="555">Ölçüm: baz (su kapalı) ↔ kalite profilleri ↔ farklı kamera açıları</text><text class="t" x="86" y="595">GPU/frame p50-p95-p99, draw call, render target sayısı, texture belleği, geçiş takılmaları</text><text class="t" x="86" y="624">Ara sahne derinliği, transparent nesneler ve yansıma kendi kendini render etmemeli</text></svg>