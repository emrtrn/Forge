<rect x="61" y="316" width="790" height="158" rx="18" fill="#fff1dd" stroke="#e4c195" stroke-width="2"/><text class="b" x="85" y="361">Opsiyonel yansıma (pahalı)</text><text class="t" x="85" y="397">Kamera altkümesi → paylaşılan RT → görünür göl/nehir</text><text class="t" x="85" y="429">Yenileme hızı, çözünürlük ve aktif yüzey sayısı sınırlı</text>
